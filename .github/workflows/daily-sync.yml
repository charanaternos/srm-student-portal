name: Daily student data sync

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync portal data
        env:
          SRM_LOGIN_URL: ${{ vars.SRM_LOGIN_URL }}
          SRM_USERNAME_SELECTOR: ${{ vars.SRM_USERNAME_SELECTOR }}
          SRM_PASSWORD_SELECTOR: ${{ vars.SRM_PASSWORD_SELECTOR }}
          SRM_SUBMIT_SELECTOR: ${{ vars.SRM_SUBMIT_SELECTOR }}
          SRM_LOGIN_SUCCESS_SELECTOR: ${{ vars.SRM_LOGIN_SUCCESS_SELECTOR }}

          SRM_ATTENDANCE_URL: ${{ vars.SRM_ATTENDANCE_URL }}
          SRM_ATTENDANCE_TABLE_SELECTOR: ${{ vars.SRM_ATTENDANCE_TABLE_SELECTOR }}
          SRM_CLASSES_URL: ${{ vars.SRM_CLASSES_URL }}
          SRM_CLASSES_TABLE_SELECTOR: ${{ vars.SRM_CLASSES_TABLE_SELECTOR }}
          SRM_MARKS_URL: ${{ vars.SRM_MARKS_URL }}
          SRM_MARKS_TABLE_SELECTOR: ${{ vars.SRM_MARKS_TABLE_SELECTOR }}

          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_USER_ID: ${{ vars.SUPABASE_USER_ID }}
          PORTAL_TIMEZONE: Asia/Kolkata

          SRM_USERNAME: ${{ secrets.SRM_USERNAME }}
          SRM_PASSWORD: ${{ secrets.SRM_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_portal.py

